<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Prompt Evaluation Platform architecture</title><desc id="desc">Prompt templates and datasets feed evaluation runs, which use a local model adapter and produce results and quality gates.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#e6edf3}.box{fill:#161b22;stroke:#58a6ff;stroke-width:2}.planned{stroke:#8b949e;stroke-dasharray:7 5}.label{font-size:18px;font-weight:600}.sub{font-size:13px;fill:#8b949e}.arrow{stroke:#58a6ff;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#58a6ff"/></marker></defs><rect width="1000" height="300" rx="16" fill="#0d1117"/><text x="40" y="45" class="label" font-size="23">Local-first evaluation workflow</text><rect x="40" y="100" width="180" height="100" rx="12" class="box"/><text x="68" y="140" class="label">Prompt catalog</text><text x="68" y="165" class="sub">immutable versions</text><rect x="40" y="215" width="180" height="45" rx="10" class="box"/><text x="68" y="243" class="label">Datasets</text><line x1="220" y1="150" x2="320" y2="150" class="arrow"/><line x1="220" y1="238" x2="320" y2="175" class="arrow"/><rect x="325" y="110" width="185" height="100" rx="12" class="box planned"/><text x="350" y="150" class="label">Evaluation runs</text><text x="350" y="175" class="sub">render + execute</text><line x1="510" y1="160" x2="610" y2="160" class="arrow"/><rect x="615" y="110" width="165" height="100" rx="12" class="box planned"/><text x="642" y="150" class="label">Model adapter</text><text x="642" y="175" class="sub">local / Ollama</text><line x1="780" y1="160" x2="875" y2="160" class="arrow"/><rect x="880" y="110" width="90" height="100" rx="12" class="box planned"/><text x="895" y="150" class="label">Results</text><text x="892" y="175" class="sub">scores</text><text x="40" y="285" class="sub">Solid outline = available now · Dashed outline = v0.1.0 planned</text></svg>