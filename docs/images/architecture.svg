<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Prompt Evaluation Platform v0.1.0 architecture</title>
  <desc id="desc">Prompt templates and datasets feed synchronous evaluation runs, which use a deterministic local provider and persist exact-match results for the API and dashboard.</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#e6edf3}.box{fill:#161b22;stroke:#58a6ff;stroke-width:2}.label{font-size:18px;font-weight:600}.sub{font-size:13px;fill:#8b949e}.arrow{stroke:#58a6ff;stroke-width:2;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#58a6ff"/></marker></defs>
  <rect width="1000" height="300" rx="16" fill="#0d1117"/>
  <text x="40" y="45" class="label" font-size="23">v0.1.0 local evaluation workflow</text>
  <rect x="40" y="92" width="180" height="75" rx="12" class="box"/><text x="68" y="124" class="label">Prompt catalog</text><text x="68" y="147" class="sub">immutable versions</text>
  <rect x="40" y="184" width="180" height="75" rx="12" class="box"/><text x="68" y="216" class="label">Datasets</text><text x="68" y="239" class="sub">ordered cases</text>
  <line x1="220" y1="130" x2="320" y2="150" class="arrow"/><line x1="220" y1="221" x2="320" y2="178" class="arrow"/>
  <rect x="325" y="110" width="185" height="100" rx="12" class="box"/><text x="350" y="150" class="label">Evaluation runs</text><text x="350" y="175" class="sub">render + execute</text>
  <line x1="510" y1="160" x2="600" y2="160" class="arrow"/>
  <rect x="605" y="110" width="175" height="100" rx="12" class="box"/><text x="628" y="150" class="label">Local provider</text><text x="628" y="175" class="sub">deterministic echo</text>
  <line x1="780" y1="160" x2="850" y2="160" class="arrow"/>
  <rect x="855" y="110" width="115" height="100" rx="12" class="box"/><text x="875" y="150" class="label">Results</text><text x="875" y="175" class="sub">exact match</text><text x="875" y="193" class="sub">+ latency</text>
  <text x="40" y="285" class="sub">PostgreSQL + Flyway persistence · REST API and dashboard served by one Spring Boot application</text>
</svg>
