<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">Capability implementation chart</title><desc id="desc">A horizontal bar chart showing completed versus planned project capabilities.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#e6edf3}.title{font-size:22px;font-weight:700}.label{font-size:15px}.small{font-size:13px;fill:#8b949e}.track{fill:#21262d}.done{fill:#2ea043}.planned{fill:#58a6ff}</style><rect width="1000" height="330" rx="16" fill="#0d1117"/><text x="40" y="44" class="title">Capability status</text><text x="40" y="70" class="small">Implementation completeness by release capability; not a performance metric.</text><g transform="translate(40 100)"><text y="15" class="label">Prompt versions</text><rect x="245" y="0" width="600" height="18" rx="9" class="track"/><rect x="245" y="0" width="600" height="18" rx="9" class="done"/><text x="860" y="15" class="small">complete</text><text y="58" class="label">Evaluation datasets</text><rect x="245" y="43" width="600" height="18" rx="9" class="track"/><rect x="245" y="43" width="600" height="18" rx="9" class="done"/><text x="860" y="58" class="small">complete</text><text y="101" class="label">Evaluation runs</text><rect x="245" y="86" width="600" height="18" rx="9" class="track"/><rect x="245" y="86" width="120" height="18" rx="9" class="planned"/><text x="860" y="101" class="small">planned</text><text y="144" class="label">Model adapter</text><rect x="245" y="129" width="600" height="18" rx="9" class="track"/><text x="860" y="144" class="small">planned</text><text y="187" class="label">Results dashboard</text><rect x="245" y="172" width="600" height="18" rx="9" class="track"/><text x="860" y="187" class="small">planned</text></g></svg>