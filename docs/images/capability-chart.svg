<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">v0.1.0 capability implementation chart</title>
  <desc id="desc">Prompt versions, evaluation datasets, evaluation runs, deterministic provider, persisted scoring, and the dashboard are implemented.</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#e6edf3}.title{font-size:22px;font-weight:700}.label{font-size:15px}.small{font-size:13px;fill:#8b949e}.track{fill:#21262d}.done{fill:#2ea043}</style>
  <rect width="1000" height="330" rx="16" fill="#0d1117"/>
  <text x="40" y="44" class="title">v0.1.0 capability status</text>
  <text x="40" y="70" class="small">Implementation completeness for the local demonstration scope; not a production-readiness metric.</text>
  <g transform="translate(40 94)">
    <text y="15" class="label">Prompt versions</text><rect x="245" y="0" width="600" height="18" rx="9" class="track"/><rect x="245" y="0" width="600" height="18" rx="9" class="done"/><text x="860" y="15" class="small">complete</text>
    <text y="52" class="label">Evaluation datasets</text><rect x="245" y="37" width="600" height="18" rx="9" class="track"/><rect x="245" y="37" width="600" height="18" rx="9" class="done"/><text x="860" y="52" class="small">complete</text>
    <text y="89" class="label">Evaluation runs</text><rect x="245" y="74" width="600" height="18" rx="9" class="track"/><rect x="245" y="74" width="600" height="18" rx="9" class="done"/><text x="860" y="89" class="small">complete</text>
    <text y="126" class="label">Deterministic provider</text><rect x="245" y="111" width="600" height="18" rx="9" class="track"/><rect x="245" y="111" width="600" height="18" rx="9" class="done"/><text x="860" y="126" class="small">complete</text>
    <text y="163" class="label">Results &amp; scoring</text><rect x="245" y="148" width="600" height="18" rx="9" class="track"/><rect x="245" y="148" width="600" height="18" rx="9" class="done"/><text x="860" y="163" class="small">complete</text>
    <text y="200" class="label">Demo dashboard</text><rect x="245" y="185" width="600" height="18" rx="9" class="track"/><rect x="245" y="185" width="600" height="18" rx="9" class="done"/><text x="860" y="200" class="small">complete</text>
  </g>
</svg>
